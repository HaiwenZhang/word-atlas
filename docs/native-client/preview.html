  #wa-client-concepts .wa-app *{box-sizing:border-box}
  #wa-client-concepts .wa-app h1,#wa-client-concepts .wa-app h2,#wa-client-concepts .wa-app h3,#wa-client-concepts .wa-app p{margin:0}
  #wa-client-concepts .wa-app button{font:inherit;color:inherit;display:flex;align-items:center;border:0;text-align:left;background:none}
  #wa-client-concepts .wa-app button:hover{filter:brightness(.97)}
  #wa-client-concepts .wa-app button:focus-visible{outline:2px solid var(--wa-accent);outline-offset:3px}
  #wa-client-concepts .wa-app svg.lucide{width:17px;height:17px;flex-shrink:0}
  #wa-client-concepts .wa-titlebar{height:39px;border-bottom:1px solid var(--wa-line);display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-size:11px;color:var(--wa-muted);letter-spacing:.2px}
  #wa-client-concepts .wa-window-dots{display:flex;gap:6px;width:95px}
  #wa-client-concepts .wa-window-dots b{width:9px;height:9px;border-radius:50%;background:var(--wa-line)}
  #wa-client-concepts .wa-window-dots b:first-child{background:#cf795f}
  #wa-client-concepts .wa-title-end{width:95px;text-align:right}
  #wa-client-concepts .wa-status,#wa-client-concepts .wa-bottom-nav,#wa-client-concepts .wa-home-indicator,#wa-client-concepts .wa-mobile-only{display:none}
  #wa-client-concepts .wa-layout{display:grid;grid-template-columns:174px minmax(0,1fr);min-height:610px}
  #wa-client-concepts .wa-sidebar{border-right:1px solid var(--wa-line);padding:27px 15px;display:flex;flex-direction:column}
  #wa-client-concepts .wa-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:2px;white-space:nowrap}
  #wa-client-concepts .wa-brand small{display:block;font-size:8px;letter-spacing:1.7px;color:var(--wa-muted);margin-top:2px;font-weight:400}
  #wa-client-concepts .wa-emblem{background:var(--wa-accent);color:var(--wa-on-accent);display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-family:&#x27;Songti SC&#x27;,serif;font-size:22px;font-weight:400}
  #wa-client-concepts .wa-side-label{font-size:10px;color:var(--wa-muted);letter-spacing:2px;margin:37px 10px 12px}
  #wa-client-concepts .wa-side-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;margin-bottom:4px;font-size:12px;width:100%;color:var(--wa-muted)}
  #wa-client-concepts .wa-side-item span{margin-left:auto;font-size:10px}
  #wa-client-concepts .wa-side-item.wa-selected{background:var(--wa-soft);color:var(--wa-accent);font-weight:500}
  #wa-client-concepts .wa-side-bottom{margin-top:auto;padding:65px 8px 0;font-size:10px;color:var(--wa-muted)}
  #wa-client-concepts .wa-green-dot{display:inline-block;width:5px;height:5px;background:#7c997b;border-radius:50%;margin-right:4px;vertical-align:middle}
  #wa-client-concepts .wa-side-bottom&gt;small{display:block;font-size:10px;margin:6px 0 23px}
  #wa-client-concepts .wa-profile{display:flex;align-items:center;gap:10px;padding-top:15px;border-top:1px solid var(--wa-line);font-size:12px}
  #wa-client-concepts .wa-profile&gt;span{font-size:11px;color:var(--wa-ink)}
  #wa-client-concepts .wa-profile small{display:block;font-size:9px;color:var(--wa-muted);margin-top:3px}
  #wa-client-concepts .wa-main{padding:28px 30px 17px;min-width:0}
  #wa-client-concepts .wa-page-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:24px}
  #wa-client-concepts .wa-eyebrow{font-size:9px;letter-spacing:1.8px;font-weight:500;color:var(--wa-muted)}
  #wa-client-concepts .wa-page-head h1{font-family:&#x27;Songti SC&#x27;,&#x27;STSong&#x27;,Georgia,serif;font-size:25px;line-height:1.4;font-weight:500;margin-top:7px}
  #wa-client-concepts .wa-streak{display:flex;gap:5px;align-items:center;white-space:nowrap;color:var(--wa-accent);font-size:11px}
  #wa-client-concepts .wa-paper-hero{display:grid;grid-template-columns:1fr 47%;min-height:295px;background:var(--wa-panel);border:1px solid var(--wa-line);border-radius:14px;overflow:hidden}
  #wa-client-concepts .wa-hero-copy{padding:24px 0 24px 27px;position:relative;z-index:1}
  #wa-client-concepts .wa-hero-copy .wa-eyebrow{color:var(--wa-accent);font-size:9px;letter-spacing:2px}
  #wa-client-concepts .wa-hero-copy h2{font-family:&#x27;Songti SC&#x27;,Georgia,serif;font-weight:500;font-size:28px;line-height:1.45;margin:12px 0 14px}
  #wa-client-concepts .wa-hero-copy em{font-style:normal;color:var(--wa-accent)}
  #wa-client-concepts .wa-plan{display:flex;gap:17px;align-items:center;margin-bottom:10px}
  #wa-client-concepts .wa-plan&gt;div{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
  #wa-client-concepts .wa-plan b{font:30px Georgia,serif;font-weight:400}
  #wa-client-concepts .wa-plan span{font-size:10px;color:var(--wa-muted)}
  #wa-client-concepts .wa-plan-divider{height:22px;width:1px;background:var(--wa-line)}
  #wa-client-concepts .wa-secondary{color:var(--wa-muted);font-size:11px;line-height:1.8}
  #wa-client-concepts .wa-app .wa-primary{background:var(--wa-accent);color:var(--wa-on-accent);border-radius:8px;justify-content:space-between;padding:12px 16px;gap:24px;font-size:12px;font-weight:500;margin-top:17px;min-height:44px}
  #wa-client-concepts .wa-primary&gt;span{font-size:19px;line-height:1}
  #wa-client-concepts .wa-hero-art{background-image:var(--wa-art-hero);background-size:cover;background-position:center;mask-image:linear-gradient(90deg,transparent,#000 35%);min-height:100%;opacity:.92}
  #wa-client-concepts .wa-paper-bottom{display:grid;grid-template-columns:1.12fr 1fr;gap:14px;margin-top:17px}
  #wa-client-concepts .wa-app .wa-daily-word{border:1px solid var(--wa-line);background:var(--wa-panel);border-radius:12px;gap:12px;padding:16px;position:relative;width:100%}
  #wa-client-concepts .wa-word-art{width:80px;height:94px;background-size:cover;background-position:center;border-radius:8px;flex-shrink:0}
  #wa-client-concepts .wa-resilient{background-image:var(--wa-art-resilient)}
  #wa-client-concepts .wa-bloom{background-image:var(--wa-art-bloom)}
  #wa-client-concepts .wa-daily-copy{display:flex;flex-direction:column;gap:4px}
  #wa-client-concepts .wa-daily-copy small{font-size:9px;color:var(--wa-accent)}
  #wa-client-concepts .wa-daily-copy strong{font:23px Georgia,serif;color:var(--wa-ink)}
  #wa-client-concepts .wa-daily-copy&gt;span{font-size:9px;color:var(--wa-muted)}
  #wa-client-concepts .wa-word-arrow{position:absolute;right:13px;top:12px;color:var(--wa-muted)}
  #wa-client-concepts .wa-week{border:1px solid var(--wa-line);border-radius:12px;padding:16px}
  #wa-client-concepts .wa-section-heading{display:flex;justify-content:space-between;align-items:center}
  #wa-client-concepts .wa-section-heading h3{font-size:11px;font-weight:500}
