[package]
name = "word-atlas-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "word-atlas"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
atlas-domain.workspace = true
atlas-storage.workspace = true
atlas-media.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
serde_json.workspace = true
chrono.workspace = true
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.3.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.3.0", default-features = false }

[dev-dependencies]
nsh-testing.workspace = true
nsh-engine = { version = "=0.3.0", default-features = false }
