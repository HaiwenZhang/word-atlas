[workspace]
members = ["crates/atlas-domain", "crates/atlas-storage", "crates/atlas-media", "crates/atlas-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
atlas-domain = { path = "crates/atlas-domain" }
atlas-storage = { path = "crates/atlas-storage" }
atlas-media = { path = "crates/atlas-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
unicode-normalization = "0.1"
regex = "1"
nsh-core = "=0.3.0"
nsh-base = { version = "=0.3.0", default-features = false }
nsh-testing = { version = "=0.3.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
